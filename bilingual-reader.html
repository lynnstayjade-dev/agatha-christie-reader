<script>

	      author: 'Agatha Christie', authorZh: '阿加莎·克里斯蒂', year: '1927', series: 'Hercule Poirot', chapters: 18
	    },
	    'the-mystery-of-the-blue-train': {

  var pair = pairs[enBook];

  document.getElementById('metaSeries').textContent = pair.series;
  document.getElementById('bookTitle').textContent = pair.title + ' / ' + pair.titleZh;

  var currentMode = 'bilingual';
  var currentChapter = 0;
  var allChapters = [];

  // Mode switching
  document.querySelectorAll('.mode-tabs button').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.mode-tabs button').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      currentMode = btn.dataset.mode;
      document.body.className = 'mode-' + currentMode;
    });
  });

  // Chapter navigation
  document.getElementById('prevCh').addEventListener('click', function() {
    if (currentChapter > 0) renderChapter(currentChapter - 1);
  });
  document.getElementById('nextCh').addEventListener('click', function() {
    if (currentChapter < allChapters.length - 1) renderChapter(currentChapter + 1);
  });

  // Load and align
  Promise.all([
    fetch('novels/' + enBook + '.txt').then(function(r) { return r.text(); }),
    fetch('novels-zh/' + pair.zh + '.txt').then(function(r) { return r.text(); })
  ]).then(function(results) {
    var enText = results[0];
    var zhText = results[1];
    allChapters = alignChapters(enText, zhText);
    document.getElementById('chapterNav').style.display = 'flex';
    if (allChapters.length > 0) {
      renderChapter(0);
    } else {
      document.getElementById('content').innerHTML = '<div class="error"><h2>无法解析章节</h2><p>文件格式可能不兼容。</p></div>';
    }
  }).catch(function(err) {
    document.getElementById('content').innerHTML = '<div class="error"><h2>加载失败</h2><p>' + err.message + '</p></div>';
  });

  function extractEnParas(text) {
    var lines = text.split(/\r?\n/);
    var chapters = [];
    var currentChapter = { enNum: '', enTitle: '', paras: [] };
    var inHeader = true;
    var currentPara = '';

    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim();
      if (inHeader) {
        if (line.indexOf('*** START OF') >= 0) { inHeader = false; }
        continue;
      }
      if (line.indexOf('*** END OF') >= 0) break;
      if (/^(Produced by|Transcribed by|Title:|Author:|Release Date:|Language:|Character set|Credits:|eBook|Copyright)/i.test(line)) continue;

      // Chapter heading detection
      var chMatch = null;
      if (/^CHAPTER\s+([IVXLC]+)\.?\s*$/.test(line)) {
        chMatch = line.match(/^CHAPTER\s+([IVXLC]+)/);
      } else if (/^CHAPTER\s+([IVXLC]+)\.\s+(.+)/.test(line)) {
        chMatch = line.match(/^CHAPTER\s+([IVXLC]+)\.\s+(.+)/);
      }

      if (chMatch) {
        if (currentChapter.paras.length > 0) {
          chapters.push(currentChapter);
        }
        currentChapter = { enNum: chMatch[1], enTitle: chMatch[2] || '', paras: [] };
        currentPara = '';
        continue;
      }

      if (line === '') {
        if (currentPara) {
          currentChapter.paras.push(currentPara.trim());
          currentPara = '';
        }
      } else {
        currentPara += (currentPara ? ' ' : '') + line;
      }
    }
    if (currentChapter.paras.length > 0) chapters.push(currentChapter);
    return chapters;
  }

  function extractZhParas(text) {
    var lines = text.split(/\r?\n/);
    var chapters = [];
    var currentChapter = { zhNum: '', paras: [] };
    var currentPara = '';

    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim();
      if (line === '') {
        if (currentPara) {
          currentChapter.paras.push(currentPara.trim());
          currentPara = '';
        }
        continue;
      }

      // Chinese chapter heading
      var chMatch = line.match(/^第(\d+)章/);
      if (chMatch) {
        if (currentChapter.paras.length > 0) {
          chapters.push(currentChapter);
        }
        currentChapter = { zhNum: chMatch[1], paras: [] };
        currentPara = '';
        continue;
      }

      currentPara += (currentPara ? '' : '') + line;
    }
    if (currentChapter.paras.length > 0) chapters.push(currentChapter);
    return chapters;
  }

  function alignChapters(enText, zhText) {
    var enChapters = extractEnParas(enText);
    var zhChapters = extractZhParas(zhText);

    // Filter out front matter (no chapter number)
    enChapters = enChapters.filter(function(ch) { return ch.enNum; });
    zhChapters = zhChapters.filter(function(ch) { return ch.zhNum; });

    var aligned = [];
    var maxCh = Math.max(enChapters.length, zhChapters.length);

    for (var i = 0; i < maxCh; i++) {
      var enCh = enChapters[i] || null;
      var zhCh = zhChapters[i] || null;

      if (!enCh && !zhCh) continue;

      var segments = [];
      if (enCh && zhCh) {
        // Align paragraphs within chapter
        segments = alignParagraphs(enCh.paras, zhCh.paras);
      } else if (enCh) {
        segments = enCh.paras.map(function(p) { return { en: p, zh: '' }; });
      } else {
        segments = zhCh.paras.map(function(p) { return { en: '', zh: p }; });
      }

      aligned.push({
        enNum: enCh ? enCh.enNum : '',
        enTitle: enCh ? enCh.enTitle : '',
        zhNum: zhCh ? zhCh.zhNum : '',
        segments: segments
      });
    }
    return aligned;
  }

  function alignParagraphs(enParas, zhParas) {
    // Simple ratio-based alignment
    var segments = [];
    var enLen = enParas.length;
    var zhLen = zhParas.length;

    if (enLen === 0 && zhLen === 0) return segments;
    if (enLen === 0) return zhParas.map(function(p) { return { en: '', zh: p }; });
    if (zhLen === 0) return enParas.map(function(p) { return { en: p, zh: '' }; });

    // Use the larger count as the base
    if (enLen >= zhLen) {
      var ratio = enLen / zhLen;
      for (var i = 0; i < zhLen; i++) {
        var start = Math.round(i * ratio);
        var end = Math.round((i + 1) * ratio);
        var enGroup = enParas.slice(start, end).join(' ');
        segments.push({ en: enGroup, zh: zhParas[i] });
      }
    } else {
      var ratio = zhLen / enLen;
      for (var i = 0; i < enLen; i++) {
        var start = Math.round(i * ratio);
        var end = Math.round((i + 1) * ratio);
        var zhGroup = zhParas.slice(start, end).join('');
        segments.push({ en: enParas[i], zh: zhGroup });
      }
    }
    return segments;
  }

  function renderChapter(idx) {
    currentChapter = idx;
    var ch = allChapters[idx];
    if (!ch) return;

    var chNum = ch.enNum || ch.zhNum;
    var chTitle = ch.enTitle || '';
    var displayNum = ch.zhNum || ch.enNum;

    document.getElementById('chInfo').textContent = '第 ' + displayNum + ' 章 / 共 ' + allChapters.length + ' 章';
    document.getElementById('prevCh').disabled = (idx === 0);
    document.getElementById('nextCh').disabled = (idx === allChapters.length - 1);

    var html = '<h2>Chapter ' + chNum;
    if (chTitle) html += ' — ' + esc(chTitle);
    html += '</h2>';

    for (var i = 0; i < ch.segments.length; i++) {
      var seg = ch.segments[i];
      html += '<div class="segment">';
      if (seg.zh) html += '<div class="zh">' + esc(seg.zh) + '</div>';
      if (seg.en) html += '<div class="en">' + esc(seg.en) + '</div>';
      html += '</div>';
    }

    document.getElementById('content').innerHTML = html;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function esc(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
